<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video2Text - 视频文案提取</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #666; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 500; margin-bottom: 8px; }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
    }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .error { color: #dc3545; }
    .progress { margin-top: 16px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video2Text</h1>
    <p>从抖音视频链接提取文案内容</p>

    <div class="form-group">
      <label>视频链接（每行一个）</label>
      <textarea id="urls" placeholder="https://v.douyin.com/xxx&#10;https://v.douyin.com/yyy"></textarea>
    </div>

    <div class="form-group">
      <label>输出格式</label>
      <select id="format">
        <option value="txt">纯文本 (txt)</option>
        <option value="srt">字幕文件 (srt)</option>
        <option value="vtt">WebVTT 字幕 (vtt)</option>
        <option value="md">Markdown (md)</option>
      </select>
    </div>

    <button id="submit" onclick="extract()">开始提取</button>

    <div id="progress" class="progress" style="display:none;"></div>
    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    async function extract() {
      const urls = document.getElementById('urls').value.trim();
      const format = document.getElementById('format').value;
      const submitBtn = document.getElementById('submit');
      const progress = document.getElementById('progress');
      const result = document.getElementById('result');

      if (!urls) {
        alert('请输入视频链接');
        return;
      }

      submitBtn.disabled = true;
      progress.style.display = 'block';
      progress.textContent = '正在处理...';
      result.style.display = 'none';

      const urlList = urls.split('\n').filter(u => u.trim());

      try {
        if (urlList.length === 1) {
          // 单视频
          const res = await fetch('/api/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: urlList[0], format })
          });
          const data = await res.json();
          if (data.success) {
            result.textContent = data.data.result?.text || '提取完成';
          } else {
            result.innerHTML = '<span class="error">' + (data.data?.error || '提取失败') + '</span>';
          }
        } else {
          // 批量
          const res = await fetch('/api/extract/batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ urls: urlList, format })
          });
          const data = await res.json();

          // 轮询任务状态
          const taskId = data.taskId;
          let task = null;
          while (!task || task.status === 'processing') {
            await new Promise(r => setTimeout(r, 1000));
            const taskRes = await fetch('/api/tasks/' + taskId);
            const taskData = await taskRes.json();
            task = taskData.data;
            progress.textContent = '处理中: ' + task.completed + '/' + task.total;
          }
          result.textContent = '完成！共处理 ' + task.total + ' 个视频';
        }
      } catch (err) {
        result.innerHTML = '<span class="error">请求失败: ' + err.message + '</span>';
      }

      result.style.display = 'block';
      progress.style.display = 'none';
      submitBtn.disabled = false;
    }
  </script>
</body>
</html>
